version: '3.8'

services:
  house-mate-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: house-mate-whatsapp-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
